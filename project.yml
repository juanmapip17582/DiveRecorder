name: DiveRecorder
options:
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DiveRecorder:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DiveRecorder
        excludes:
          - "Resources/Info.plist"
    info:
      path: DiveRecorder/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juanma.diverecorder
        PRODUCT_NAME: DiveRecorder
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    schemes:
      DiveRecorder:
        build:
          targets:
            DiveRecorder: all
        run:
          config: Debug
        archive:
          config: Release
